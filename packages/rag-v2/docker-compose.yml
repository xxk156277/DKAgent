services:
    postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        environment:
            POSTGRES_DB: rag
            POSTGRES_USER: rag
            POSTGRES_PASSWORD: rag
        ports:
            - "5439:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
            interval: 3s
            timeout: 3s
            retries: 20
        volumes:
            - rag_pg_data:/var/lib/postgresql

volumes:
    rag_pg_data:
